      rx_position_m: [-1.5, 0.05, 1.5]
      look_at_m: [0.0, 0.0, 1.5]
    scattering:
      enabled: true
      coefficient: 0.5
      pattern: backscattering
      alpha_r: 20
      alpha_i: 20
      lambda_: 0.3
    path_solver:
      max_depth: 2
      samples_per_src: 300000
      los: false
      specular_reflection: true
      diffuse_reflection: true
      seed: 8

